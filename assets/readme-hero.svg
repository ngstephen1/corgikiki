<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CorgiKiki animated welcome banner</title>
  <desc id="desc">A friendly corgi watches a perspective cube draw itself beside the CorgiKiki name.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff9f0"/><stop offset="1" stop-color="#f9e9da"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e9d9c9" stroke-width="1" opacity=".55"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6b4830" flood-opacity=".12"/></filter>
    <style>
      .sketch{stroke-dasharray:390;stroke-dashoffset:0;animation:draw 3.2s ease forwards}
      .sketch:nth-of-type(2){animation-delay:.35s}.sketch:nth-of-type(3){animation-delay:.7s}
      .pup{transform-origin:934px 175px;animation:bob 3s ease-in-out infinite}
      .star{transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
      .star.two{animation-delay:1.1s}
      @keyframes draw{from{stroke-dashoffset:390}to{stroke-dashoffset:0}}
      @keyframes bob{50%{transform:translateY(-7px) rotate(2deg)}}
      @keyframes twinkle{50%{opacity:.35;transform:scale(.7)}}
      @media(prefers-reduced-motion:reduce){.sketch{stroke-dashoffset:0;animation:none}.pup,.star{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#paper)"/>
  <path d="M28 0H1172Q1200 0 1200 28V34H0V28Q0 0 28 0" fill="#f47758"/>
  <path d="M680 34H1200V360H680Z" fill="url(#grid)" opacity=".6"/>
  <circle cx="939" cy="175" r="139" fill="#f9d8bf" opacity=".55"/>
  <circle cx="939" cy="175" r="113" fill="none" stroke="#e8b999" stroke-width="2" opacity=".65"/>
  <text x="62" y="93" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#b76b4b">DRAW · LEARN · GROW</text>
  <text x="58" y="194" font-family="Arial,Helvetica,sans-serif" font-size="83" font-weight="800" letter-spacing="-4" fill="#332b27">Corgi<tspan fill="#f47758">Kiki</tspan></text>
  <text x="63" y="247" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#6d5f55">Your AI architecture sketching buddy</text>
  <text x="63" y="304" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#c66d4d">Every great architect starts with a sketch.</text>
  <g fill="none" stroke="#ef9472" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8">
    <path class="sketch" d="M718 232L787 219L787 282L718 296Z"/>
    <path class="sketch" d="M718 232L750 177L822 168L787 219M787 282L822 228V168"/>
    <path class="sketch" d="M718 296L750 242L822 228M750 177V242"/>
  </g>
  <path d="M680 145H868" stroke="#e7af96" stroke-dasharray="6 7" stroke-width="1.5"/>
  <circle cx="832" cy="145" r="5" fill="#f47758"/>
  <g class="pup" filter="url(#shadow)">
    <path d="M852 124L844 65L893 100M1017 124L1025 65L976 100" fill="#d78d5e" stroke="#5b4033" stroke-width="6" stroke-linejoin="round"/>
    <path d="M852 118L852 83L879 105M1017 118L1017 83L990 105" fill="#f9d3ad"/>
    <ellipse cx="934" cy="182" rx="98" ry="100" fill="#efa976" stroke="#5b4033" stroke-width="6"/>
    <path d="M934 93C950 121 965 132 965 165C965 188 953 195 934 195S903 188 903 165C903 132 918 121 934 93Z" fill="#fff8e9"/>
    <path d="M842 185C853 164 883 156 904 170C923 182 933 204 934 223C935 204 945 182 964 170C985 156 1015 164 1026 185C1018 240 981 275 934 275S850 240 842 185Z" fill="#fff8e9"/>
    <circle cx="884" cy="186" r="6" fill="#3f302b"/><circle cx="984" cy="186" r="6" fill="#3f302b"/>
    <ellipse cx="862" cy="207" rx="13" ry="7" fill="#f6b0a4" opacity=".7"/><ellipse cx="1006" cy="207" rx="13" ry="7" fill="#f6b0a4" opacity=".7"/>
    <path d="M924 220Q934 213 944 220Q941 230 934 232Q927 230 924 220Z" fill="#3f302b"/>
    <path d="M934 232V242M934 242Q924 251 914 243M934 242Q944 251 954 243" fill="none" stroke="#3f302b" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="star" fill="#f47758"><path d="M1102 99l4 13 13 4-13 4-4 13-4-13-13-4 13-4z"/></g>
  <g class="star two" fill="#f47758"><path d="M1038 279l3 10 10 3-10 3-3 10-3-10-10-3 10-3z"/></g>
</svg>
